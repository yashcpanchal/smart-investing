[project]
name = "smart-investing"
version = "0.1.0"
description = "Natural-language thematic investing: prompt -> mathematically-optimized US-equity portfolio -> autonomous rebalancing via Robinhood Agentic MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Yash Panchal" },
    { name = "Dhruv Gupta" },
]

# Core dependencies — pure math + data + domain. Deliberately light so the
# engine installs fast and runs offline (network only for live data adapters).
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "cvxpy>=1.5",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "httpx>=0.27",
    "duckdb>=1.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
# Heavy / phase-specific extras. Installed when we reach those phases so the
# core never blocks on a slow or platform-finicky wheel.
accel = ["jax>=0.4.30", "jaxlib>=0.4.30"]          # Phase 1 Monte-Carlo accel (numpy fallback always works)
retrieval = ["sentence-transformers>=3.0", "faiss-cpu>=1.8", "rank-bm25>=0.2.2", "networkx>=3.3"]  # Phase 5
llm = ["anthropic>=0.34"]                           # Phase 6 agent brain
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"] # Phase 9
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
si = "smart_investing.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_investing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: keep `(str, Enum)` over StrEnum for maximal pydantic/serialization compat.
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
